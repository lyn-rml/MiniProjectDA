
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image names
        id: images
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sysinfo-api" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build -t sysinfo-api:latest .

      - name: Tag Docker images
        run: |
          docker tag sysinfo-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/sysinfo-api:latest
          docker tag sysinfo-api:latest ${{ steps.images.outputs.ghcr }}:latest

      - name: Publish to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sysinfo-api:latest

      - name: Publish to GitHub Container Registry
        run: |
          docker push ${{ steps.images.outputs.ghcr }}:latest
